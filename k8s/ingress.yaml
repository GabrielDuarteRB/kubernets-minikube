apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernets-minikube-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: ${APP_HOST}
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: kubernets-minikube-service
              port:
                number: 80