apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kubernets-minikube-autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kubernets-minikube
  minReplicas: ${MIN_REPLICAS}
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60