apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernets-minikube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernets-minikube
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: kubernets-minikube
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: ambiente
                    operator: In
                    values:
                      - ${AMBIENTE}

      containers:
        - name: kubernets-minikube
          image: gabrielduarter/kubernets-minikube:1.2

          envFrom:
            - configMapRef:
                name: kubernets-minikube-config
            - secretRef:
                name: kubernets-minikube-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"